<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="color-scheme" content="dark" />
<title>Plateau</title>
<style>
  html, body { background: #0b1220; }
  body { margin: 0; color: #e6edf3; font-family: system-ui, sans-serif;
         display: flex; align-items: center; justify-content: center; height: 100vh; }
  .box { display: flex; flex-direction: column; align-items: center; gap: 16px; }
  .spinner { width: 32px; height: 32px; border: 3px solid #2f3b52; border-top-color: #4f8cff;
             border-radius: 50%; animation: spin 1s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
</style>
</head>
<body>
  <div class="box"><div class="spinner"></div><div>正在启动 Plateau…</div></div>
  <script>
    window.__plateauFail = function (msg) {
      var box = document.querySelector('.box');
      if (!box) return;
      box.innerHTML = '<div style="max-width:720px;padding:20px;border:1px solid #7a3b3b;'
        + 'border-radius:8px;background:#1b1420;color:#ffb4b4;font-size:14px;line-height:1.6">'
        + '<strong>Plateau 启动失败</strong>'
        + '<pre id="plateau-err" style="white-space:pre-wrap;margin:12px 0 0;'
        + 'font-family:inherit;color:inherit"></pre></div>';
      document.getElementById('plateau-err').textContent = msg || '';
    };
  </script>
</body>
</html>
